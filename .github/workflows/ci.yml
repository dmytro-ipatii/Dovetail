name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (iOS, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15 checks the oldest supported toolchain (Xcode 16, Swift 6.0+),
        # macos-26 the newest SDK on GitHub's runners.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for targets
        id: targets
        run: |
          count=$(swift package describe --type json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["targets"]))')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Package has $count target(s)"
      - name: Test
        if: steps.targets.outputs.count != '0'
        run: |
          # Xcode names the scheme "Dovetail-Package" when there are several products, "Dovetail" otherwise.
          scheme=$(xcodebuild -list -json | python3 -c '
          import json, sys
          schemes = json.load(sys.stdin)["workspace"]["schemes"]
          print(next((s for s in schemes if s.endswith("-Package")), schemes[0]))')
          # Use the first available iPhone simulator, whatever the runner image ships with.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          echo "Testing scheme $scheme on simulator $udid"
          xcodebuild test \
            -scheme "$scheme" \
            -destination "id=$udid" \
            -skipPackagePluginValidation
