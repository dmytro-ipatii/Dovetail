name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          xcodebuild test \
            -scheme Dovetail-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation
